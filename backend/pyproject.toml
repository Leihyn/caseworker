[project]
name = "caseworker-backend"
version = "0.1.0"
description = "Caseworker — evidence-first dispute agent on Strands Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
agentcore = [
    "bedrock-agentcore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
